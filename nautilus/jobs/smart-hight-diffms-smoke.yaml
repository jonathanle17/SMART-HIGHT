apiVersion: batch/v1
kind: Job
metadata:
  name: jonathanle-spectre-smoke
  namespace: guru-research
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      imagePullSecrets:
        # Create once: kubectl create secret docker-registry gitlab-registry-nrp-pull \
        #   --docker-server=gitlab-registry.nrp-nautilus.io --docker-username=... --docker-password=...
        # Or change this name to match an existing registry pull secret in your namespace.
        - name: gitlab-auth
      serviceAccountName: default
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              # --- 1. SYSTEM DEPENDENCIES ---
              # Fixed: Missing libXrender for RDKit
              apt-get update && apt-get install -y libxrender1 libxext6 libsm6 libgl1-mesa-glx

              # --- 2. SETUP SSH & CLONE ---
              mkdir -p ~/.ssh
              if [ -f /root/gurusmart/.ssh/id_rsa ]; then
                cp -f /root/gurusmart/.ssh/id_rsa ~/.ssh/id_rsa
                if [ -f /root/gurusmart/.ssh/id_rsa.pub ]; then
                  cp -f /root/gurusmart/.ssh/id_rsa.pub ~/.ssh/id_rsa.pub
                fi
              elif [ -f /ssh/id_rsa ]; then
                cp -f /ssh/id_rsa ~/.ssh/id_rsa
                if [ -f /ssh/id_rsa.pub ]; then
                  cp -f /ssh/id_rsa.pub ~/.ssh/id_rsa.pub
                fi
              fi
              if [ -f ~/.ssh/id_rsa ]; then
                chmod 600 ~/.ssh/id_rsa
                if [ -f ~/.ssh/id_rsa.pub ]; then
                  chmod 644 ~/.ssh/id_rsa.pub
                fi
              fi
              needs_ssh_key=0
              case "${SMART_HIGHT_REPO}" in git@*|ssh://*) needs_ssh_key=1 ;; esac
              if [ "${needs_ssh_key}" -eq 1 ] && [ ! -f ~/.ssh/id_rsa ]; then
                echo "[ERROR] SMART_HIGHT_REPO uses SSH but no private key was found." >&2
                echo "[ERROR] Put id_rsa on your PVC at /root/gurusmart/.ssh/id_rsa or mount it at /ssh/id_rsa." >&2
                exit 1
              fi
              if [ ! -d /code/SMART-HIGHT ]; then
                export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
                git clone --branch "${SMART_HIGHT_BRANCH}" "${SMART_HIGHT_REPO}" /code/SMART-HIGHT
              fi

              cd /code/SMART-HIGHT

              # --- 3. PIXI & PYTHON 3.9 SETUP ---
              if command -v pixi >/dev/null 2>&1; then
                pixi install
                eval "$(pixi shell-hook)"

                # Fixed: Ensure pip exists in the 3.9 env
                python -m ensurepip --default-pip || true

                # Fixed: Create python3.9 alias for DiffMS check
                mkdir -p /tmp/bin
                ln -sf "$(which python)" /tmp/bin/python3.9
                export PATH="/tmp/bin:$PATH"
              fi

              # --- 4. RUN PIPELINE ---
              echo "Starting pipeline with Python $(python --version)"
              bash /code/SMART-HIGHT/nautilus/scripts/run_smart_hight_diffms_pipeline.sh
          env:
            - name: PIPELINE_MODE
              value: smoke
            - name: MOONSHOT_DATASET_ZIP
              value: MoonshotDatasetv3.zip
            - name: DATASET_DIR
              value: /root/datasets
            - name: SMART_HIGHT_REPO
              value: git@github.com:jonathanle17/SMART-HIGHT.git
            - name: SMART_HIGHT_BRANCH
              value: main
            - name: DIFFMS_REPO
              value: https://github.com/coleygroup/DiffMS.git
            - name: DIFFMS_BRANCH
              value: master
            - name: PYTHON_BIN
              value: python3
            - name: GPU_COUNT
              value: "0"
            - name: ARTIFACT_ROOT
              value: /root/gurusmart/experiments
          resources:
            limits:
              memory: 16Gi
              cpu: "4"
              ephemeral-storage: 200Gi
            requests:
              memory: 16Gi
              cpu: "4"
              ephemeral-storage: 200Gi
          volumeMounts:
            - mountPath: /root/gurusmart
              name: user-pvc
            - mountPath: /root/datasets
              name: smart-datasets
            - mountPath: /workspace
              name: data-unzip
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /code
              name: code-workdir
      volumes:
        - name: user-pvc
          persistentVolumeClaim:
            claimName: jonathanle-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
        - name: dshm
          emptyDir:
            medium: Memory
        - name: data-unzip
          emptyDir: {}
        - name: code-workdir
          emptyDir: {}
