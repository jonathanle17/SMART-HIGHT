env:
            - name: PIPELINE_MODE
              value: "full"  # This tells the script to run the full dataset
            - name: SMART_HIGHT_REPO
              value: "git@github.com:jonathanle17/SMART-HIGHT.git"
            - name: SMART_HIGHT_BRANCH
              value: "main"
            - name: DIFFMS_REPO
              value: "https://github.com/coleygroup/DiffMS.git"
            - name: DIFFMS_BRANCH
              value: "master"
            - name: DATASET_DIR
              value: "/root/datasets"
            - name: ARTIFACT_ROOT
              value: "/root/gurusmart/experiments"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              # 1. Simple SSH Setup (Same as Smoke)
              mkdir -p ~/.ssh && cp /root/gurusmart/.ssh/id_rsa ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
              ssh-keyscan github.com >> ~/.ssh/known_hosts

              # 2. Simple Clone Logic (Fixed syntax)
              git clone -b ${SMART_HIGHT_BRANCH} ${SMART_HIGHT_REPO} /code/SMART-HIGHT || cd /code/SMART-HIGHT
              git clone -b ${DIFFMS_BRANCH} ${DIFFMS_REPO} /code/DiffMS || true

              # 3. Use Pixi to handle the environment and run (Same as Smoke)
              cd /code/SMART-HIGHT
              pixi run smoke