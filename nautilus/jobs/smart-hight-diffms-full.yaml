apiVersion: batch/v1
kind: Job
metadata:
  name: jonathanle-spectre-full
  namespace: guru-research
spec:
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: gitlab-auth
      restartPolicy: Never
      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8
          env:
            - name: PIPELINE_MODE
              value: "full"
            - name: SMART_HIGHT_REPO
              value: "git@github.com:jonathanle17/SMART-HIGHT.git"
            - name: SMART_HIGHT_BRANCH
              value: "main"
            - name: DIFFMS_REPO
              value: "https://github.com/coleygroup/DiffMS.git"
            - name: DIFFMS_BRANCH
              value: "master"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              # 1. SSH Setup
              mkdir -p ~/.ssh && cp /root/gurusmart/.ssh/id_rsa ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
              ssh-keyscan github.com >> ~/.ssh/known_hosts

              # 2. Clone Repos
              git clone -b ${SMART_HIGHT_BRANCH} ${SMART_HIGHT_REPO} /code/SMART-HIGHT || cd /code/SMART-HIGHT
              git clone -b ${DIFFMS_BRANCH} ${DIFFMS_REPO} /code/DiffMS || true

              # 3. Run Full Task
              cd /code/SMART-HIGHT
              pixi run full
          resources:
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "2"
              ephemeral-storage: 600Gi
            requests:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "2"
              ephemeral-storage: 600Gi
          volumeMounts:
            - mountPath: /root/gurusmart
              name: user-pvc
            - mountPath: /root/datasets
              name: smart-datasets
            - mountPath: /code
              name: code-workdir
      volumes:
        - name: user-pvc
          persistentVolumeClaim:
            claimName: jonathanle-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
        - name: code-workdir
          emptyDir: {}