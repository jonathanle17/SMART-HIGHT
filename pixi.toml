[workspace]
authors = ["jonathanle17 <jonathan.le@mrjaffesclass.com>"]
channels = ["conda-forge", "pytorch", "nvidia"]
# Allow CUDA metapackages from nvidia alongside conda-forge (strict excludes them).
channel-priority = "disabled"
name = "SMART-HIGHT"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.9.*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
rdkit = "==2024.09.4"
pytorch = "==2.3.1"
pytorch-cuda = "==11.8"
pytorch-lightning = "*"
hydra-core = "*"
torch-geometric = "*"
pip = "*"

[tasks]
# Define the smoke test as a task to simplify the pod command
smoke = "bash nautilus/scripts/run_smart_hight_diffms_pipeline.sh"
full = "bash nautilus/scripts/run_smart_hight_diffms_pipeline.sh"

[target.linux-64.dependencies]
# Hardware-specific dependencies can go here if needed