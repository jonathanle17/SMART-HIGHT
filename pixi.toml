[workspace]
authors = ["jonathanle17 <jonathan.le@mrjaffesclass.com>"]
channels = ["conda-forge"]
name = "SMART-HIGHT"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.9.*"
pip = "*"
xorg-libxrender = ">=0.9.10"
xorg-libxext = ">=1.3.4"
libsm = ">=1.2.3"
libglvnd = ">=1.3.2"
numpy = ">=2.4.2,<3"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
wandb = ">=0.25.0,<0.26"
rdkit = ">=2025.9.6,<2026"
ipython = ">=9.10.0,<10"
ipykernel = ">=7.2.0,<8"
jupyter = ">=1.1.1,<2"
tqdm = ">=4.67.3,<5"
tyro = ">=1.0.8,<2"
gdown = ">=5.2.1,<6"
openpyxl = ">=3.1.5,<4"
pyarrow = ">=23.0.1,<24"

[pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
lightning = { version = "==2.6.1" }
torch_geometric = { version = "==2.7.0"}